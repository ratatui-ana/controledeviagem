<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Controle de Viagem</title>

    <link rel="stylesheet" href="login.css">
</head>


<body>

    <main class="container">

        <section class="login-card">

            <div class="logo">
                🚌
            </div>

            <h1>Controle de Viagem</h1>

            <p class="descricao">
                Faça login para acessar o acompanhamento dos alunos.
            </p>


            <form>

                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                    >

                </div>


                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                    >

                </div>


                <div class="opcoes">

                    <label>

                        <input type="checkbox">

                        Lembrar de mim

                    </label>

                    <a href="#">
                        Esqueci minha senha
                    </a>

                </div>


                <button type="submit">

                    Entrar

                </button>

            </form>


            <p class="rodape">

                Sistema de acompanhamento de viagem

            </p>

        </section>

    </main>

</body>

</html>
